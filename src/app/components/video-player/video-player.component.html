<div class="player-box" #playerBox>
  <video
    #video
    class="video"
    [src]="videoUrl()"
    preload="metadata"
    playsinline
    (click)="togglePlay()"
    (loadedmetadata)="onLoadedMetadata()"
    (timeupdate)="onTimeUpdate()"
    (play)="isPlaying.set(true)"
    (pause)="isPlaying.set(false)"
    (ended)="onEnded()"
    (error)="onError()"
  ></video>

  <!-- Error / loading on top of the video -->
  @if (hasError()) {
    <div class="video-message">
      <p class="video-message-title">{{ lang.t('videoError') }}</p>
      <p>{{ lang.t('videoErrorHint') }}</p>
      <button type="button" class="button button-primary" (click)="retry()">
        {{ lang.t('tryAgain') }}
      </button>
    </div>
  } @else if (isLoading()) {
    <div class="video-message">
      <p>{{ lang.t('loading') }}</p>
    </div>
  }

  <!-- Controls -->
  <div class="controls">
    <input
      type="range"
      class="seek-bar"
      min="0"
      step="0.1"
      [max]="duration()"
      [value]="currentTime()"
      [disabled]="hasError()"
      (input)="onSeek($event)"
    />

    <div class="controls-row">
      <button
        type="button"
        class="control-button"
        [disabled]="hasError()"
        [title]="isPlaying() ? lang.t('pause') : lang.t('play')"
        (click)="togglePlay()"
      >
        @if (isPlaying()) {
          ❚❚
        } @else {
          ▶
        }
      </button>

      <!-- dir="ltr" so the time is not reversed in Arabic -->
      <span class="time-text" dir="ltr">{{ currentTime() | time }} / {{ duration() | time }}</span>

      <select class="speed-select" [title]="lang.t('speed')" (change)="onSpeedChange($event)">
        @for (item of speeds; track item) {
          <option [value]="item" [selected]="item === speed()">{{ item }}x</option>
        }
      </select>

      <button
        type="button"
        class="control-button"
        [title]="lang.t('fullscreen')"
        (click)="toggleFullscreen()"
      >
        ⛶
      </button>
    </div>
  </div>
</div>
